# .github/workflows/leakcheck.yml: download a released binary once, cache it,
# then let the action upload SARIF and fail only on findings that are not in
# the baseline. The action itself is at .github/actions/leakcheck.
name: leakcheck
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload-sarif

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --changed-only needs the base commit
      - name: Cache the leakcheck binary
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/leakcheck
          key: leakcheck-${{ runner.os }}-1.0.0
      - name: Install leakcheck
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/OWNER/leakcheck/releases/download/v1.0.0/leakcheck-1.0.0-linux-x86_64.tar.gz"
          curl -fsSL "$url" | tar xz -C /tmp
          install -m 0755 /tmp/leakcheck-1.0.0-linux-x86_64/bin/leakcheck "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Gate on new findings
        uses: ./.github/actions/leakcheck
        with:
          target: .
          mode: static
          baseline: .leakcheck-baseline.txt
          suppressions: ci/leakcheck.supp
          min-severity: warning
          upload-sarif: "true"
