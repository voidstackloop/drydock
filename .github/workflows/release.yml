name: Release

# One archive per platform, built from the tag, never from a laptop. macOS is a
# universal binary (arm64 + x86_64), so one archive covers both kinds of Mac.

# A tag publishes. The manual run builds exactly the same archives without
# creating a release, so the packaging can be tested before the first tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and package
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          name="leakcheck-$version-linux-x86_64"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLEAKCHECK_BUILD_TESTS=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/stage/$name"
          tar -C stage -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: leakcheck-*.tar.gz

  linux-aarch64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-aarch64-linux-gnu
      - name: Build and package
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          name="leakcheck-$version-linux-aarch64"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLEAKCHECK_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/stage/$name"
          tar -C stage -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: leakcheck-*.tar.gz

  windows-x86_64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Build
        run: pwsh -File build-windows.ps1 -Build build
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $name = "leakcheck-$version-windows-x86_64"
          $root = "stage/$name"
          New-Item -ItemType Directory -Force "$root/bin", "$root/share/leakcheck/model", "$root/share/doc/leakcheck" | Out-Null
          Copy-Item build/leakcheck.exe, build/leakcheck_preload.dll "$root/bin"
          Copy-Item model/pe-malware.ai, model/pe-malware.metrics.json "$root/share/leakcheck/model"
          Copy-Item LICENSE, README.md, docs/REFERENCE.md, docs/MODEL.md "$root/share/doc/leakcheck"
          Compress-Archive -Path $root -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: leakcheck-*.zip

  macos-universal:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: brew install ninja
      - name: Build and package
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          name="leakcheck-$version-macos-universal"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLEAKCHECK_BUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/stage/$name"
          tar -C stage -czf "$name.tar.gz" "$name"
      - name: Check both slices are there
        run: |
          set -euo pipefail
          lipo -archs stage/*/bin/leakcheck | tee /tmp/archs
          grep -q arm64 /tmp/archs && grep -q x86_64 /tmp/archs
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: leakcheck-*.tar.gz

  release:
    needs: [linux-x86_64, linux-aarch64, macos-universal, windows-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # There is no dependency tree to inventory: the tool is one binary. The
      # SBOM says so, with the hash of every archive, and ships with them.
      - name: SBOM
        working-directory: dist
        run: python3 ../tools/sbom.py --version "$(cat ../VERSION)" --out SBOM.cdx.json leakcheck-*
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "leakcheck $GITHUB_REF_NAME"
          --generate-notes
